<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SWB entscheidet – bald verfügbar.">
    <title>SWB entscheidet – Bald verfügbar</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2.5rem, 8vw, 5rem);
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        box-shadow: 0 1rem 3rem rgb(23 32 51 / 8%);
      }

      .mark {
        display: inline-grid;
        place-items: center;
        width: 4rem;
        height: 4rem;
        margin-bottom: 1.5rem;
        color: #fff;
        font-size: 1.25rem;
        font-weight: 700;
        background: #2563eb;
        border-radius: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      p {
        margin: 1rem 0 0;
        color: #526078;
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">SWB</div>
      <h1>Bald verfügbar</h1>
      <p>Wir arbeiten gerade an etwas Neuem. Schau bald wieder vorbei.</p>
    </main>
  </body>
</html>
